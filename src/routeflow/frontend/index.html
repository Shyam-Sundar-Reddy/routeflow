<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RouteFlow</title>
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="wordmark"><span class="dot"></span>routeflow</div>
      <nav class="tabs">
        <a id="docs-tab" class="tab" href="/docs">Docs</a>
        <span class="tab active">Flow</span>
      </nav>
      <button id="theme-toggle" class="theme-toggle" type="button" title="Toggle theme"></button>
    </header>

    <div class="body">
      <aside class="sidebar">
        <h3>Endpoints</h3>
        <div id="endpoint-list" class="endpoint-list">
          <p class="placeholder">Loading endpoints…</p>
        </div>

        <div id="trace-list-section" class="trace-list-section" hidden>
          <h3 id="trace-list-heading">Recent traces</h3>
          <div id="trace-list" class="trace-list"></div>
        </div>
      </aside>

      <main class="canvas-wrap">
        <p id="canvas-placeholder" class="placeholder">Select an endpoint to see its traces.</p>
        <div id="canvas-body" class="canvas-body" hidden>
          <div id="canvas-scroll" class="canvas-scroll">
            <div id="graph" class="graph"></div>
          </div>
          <div class="strip">
            <h4>Timeline</h4>
            <div class="strip-scroll">
              <svg id="timeline-svg" preserveAspectRatio="none"></svg>
            </div>
          </div>
        </div>
      </main>

      <aside id="detail" class="detail" hidden>
        <div class="detail-section">
          <h4>Selected span</h4>
          <div class="detail-title"><span id="detail-name" class="fn"></span></div>
          <div id="detail-metrics"></div>
        </div>

        <div class="detail-section">
          <h4>Arguments</h4>
          <div id="detail-args"></div>
        </div>

        <div class="detail-section">
          <h4>Logs</h4>
          <div id="detail-logs"></div>
        </div>

        <div id="detail-error-section" class="detail-section" hidden>
          <h4>Exception</h4>
          <div id="detail-error" class="error-box"></div>
        </div>
      </aside>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
