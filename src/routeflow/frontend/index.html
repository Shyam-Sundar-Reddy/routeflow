<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RouteFlow</title>
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="wordmark"><span class="dot"></span>routeflow</div>
    </header>

    <div class="body">
      <aside class="sidebar">
        <h3>Endpoints</h3>
        <div id="endpoint-list" class="endpoint-list">
          <p class="placeholder">Loading endpoints…</p>
        </div>

        <div id="trace-list-section" class="trace-list-section" hidden>
          <h3 id="trace-list-heading">Recent traces</h3>
          <div id="trace-list" class="trace-list"></div>
        </div>
      </aside>

      <main class="canvas-wrap">
        <p class="placeholder">Select an endpoint to see its traces.</p>
      </main>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
