[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "routeflow"
version = "0.1.0"
description = "Real-time execution flow visualization for FastAPI applications"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "starlette>=0.37", "httpx>=0.27", "fastapi>=0.110"]

[project.scripts]
routeflow = "routeflow.cli:app"

[project.urls]
Homepage = "https://github.com/Shyam-Sundar-Reddy/routeflow"
Repository = "https://github.com/Shyam-Sundar-Reddy/routeflow"

[tool.hatch.build.targets.wheel]
packages = ["src/routeflow"]
