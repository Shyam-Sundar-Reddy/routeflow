[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "routeflow"
version = "0.3.0"
description = "Real-time execution flow visualization for FastAPI applications"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    # The middleware only needs FastAPI/Starlette structurally (see
    # integration.py's Protocol) and never imports either - but the
    # mounted server (server.py, live.py) is a real Starlette app with a
    # WebSocket, so starlette itself is a genuine runtime dependency, not
    # just a dev/test one.
    "starlette>=0.37",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "fastapi>=0.110", "ruff>=0.6"]

[project.scripts]
routeflow = "routeflow.cli:app"

[project.urls]
Homepage = "https://github.com/Shyam-Sundar-Reddy/routeflow"
Repository = "https://github.com/Shyam-Sundar-Reddy/routeflow"

[tool.hatch.build.targets.wheel]
packages = ["src/routeflow"]

[tool.ruff]
# 88 (ruff's/black's default) is tighter than this codebase's actual
# comment style - "why", not "what" explanations run long, and wrapping
# them mid-thought hurts readability more than a longer line does.
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "BLE"]
ignore = [
    # PEP 695 generic syntax (`def track[F: Callable](...)`) is a valid
    # option since this project already requires Python >=3.12, but the
    # TypeVar form here reads the same to anyone from an older codebase
    # and isn't worth the churn - a style call, not a bug.
    "UP047",
    # Several tests deliberately nest `with span_scope(...):` blocks so
    # the indentation visually mirrors the call tree under test (root ->
    # child -> grandchild) - collapsing them into one `with a, b:` would
    # read as flatter than the thing being tested actually is.
    "SIM117",
]
