<title>RouteFlow Social Card</title>
<style>
  :root {
    --bg: #0c0e12;
    --panel: #171b21;
    --border: rgba(255, 255, 255, 0.1);
    --text: #e7eaee;
    --muted: #8b93a1;
    --amber: #e0954a;
    --amber-deep: #c96f2e;
    --err: #e2554f;
    --font-ui: ui-sans-serif, "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
    --font-mono: ui-monospace, "Cascadia Code", "JetBrains Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    width: 1200px;
    height: 627px;
    background: var(--bg);
    background-image: radial-gradient(circle at 82% 18%, rgba(224,149,74,0.14), transparent 55%);
    color: var(--text);
    font-family: var(--font-ui);
    overflow: hidden;
  }
  .card {
    position: relative;
    width: 1200px;
    height: 627px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 88px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 40px;
  }
  .brand .word {
    font-weight: 800;
    font-size: 26px;
    letter-spacing: -0.5px;
  }
  h1 {
    font-size: 58px;
    font-weight: 800;
    letter-spacing: -1.5px;
    line-height: 1.08;
    margin: 0 0 22px;
    max-width: 780px;
  }
  h1 .accent { color: var(--amber); }
  .lede {
    font-size: 21px;
    color: var(--muted);
    max-width: 620px;
    margin: 0 0 30px;
  }
  .install {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 14px 22px;
    font-family: var(--font-mono);
    font-size: 19px;
    width: fit-content;
  }
  .install .prompt { color: var(--muted); }
  .diagram {
    position: absolute;
    right: 60px;
    top: 90px;
    width: 300px;
  }
</style>

<div class="card">
  <div class="brand">
    <svg width="34" height="34" viewBox="0 0 100 100" role="img" aria-label="routeflow">
      <g fill="none" stroke="#e0954a" stroke-width="4" stroke-linecap="round">
        <path d="M50,29 C50,40 30,42 27,48" />
        <path d="M50,29 L50,52" />
        <path d="M50,29 C50,40 70,42 73,48" />
        <path d="M50,68 L50,79" />
      </g>
      <circle cx="50" cy="20" r="11" fill="#c96f2e" />
      <circle cx="27" cy="55" r="8" fill="#e0954a" />
      <circle cx="50" cy="60" r="8" fill="#e0954a" />
      <circle cx="73" cy="55" r="8" fill="#e0954a" />
      <circle cx="50" cy="86" r="7" fill="#e0954a" />
    </svg>
    <span class="word">routeflow</span>
  </div>

  <h1>Swagger shows the contract.<br>RouteFlow shows <span class="accent">what happened.</span></h1>
  <p class="lede">One decorator. A live node graph next to your FastAPI docs. See the real call tree of any request — order, timing, errors.</p>
  <div class="install"><span class="prompt">$</span> pip install routeflow</div>

  <svg class="diagram" viewBox="0 0 260 200" role="img" aria-label="A node graph with one node highlighted as a timeout error">
    <g stroke="#4a5058" stroke-width="1.6" fill="none">
      <path d="M130,36 C130,54 65,58 52,74" />
      <path d="M130,36 L130,74" />
      <path d="M130,36 C130,54 195,58 208,74" />
      <path d="M130,92 L130,128" stroke="#e2554f" stroke-width="2.4" />
    </g>
    <rect x="86" y="18" width="88" height="24" rx="5" fill="#171b21" stroke="#3a414d" />
    <text x="130" y="34" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="11" fill="#e7eaee">checkout</text>
    <rect x="12" y="74" width="80" height="24" rx="5" fill="#171b21" stroke="#3a414d" />
    <text x="52" y="90" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="10" fill="#e7eaee">validate</text>
    <rect x="94" y="74" width="76" height="24" rx="5" fill="#171b21" stroke="#3a414d" />
    <text x="132" y="90" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="10" fill="#e7eaee">charge</text>
    <rect x="176" y="74" width="80" height="24" rx="5" fill="#171b21" stroke="#3a414d" />
    <text x="216" y="90" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="10" fill="#e7eaee">reserve</text>
    <rect x="82" y="128" width="130" height="28" rx="5" fill="#2a1414" stroke="#e2554f" stroke-width="1.8" />
    <text x="147" y="147" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="10.5" fill="#f0a3a0">✕ stripe_charge</text>
  </svg>
</div>
